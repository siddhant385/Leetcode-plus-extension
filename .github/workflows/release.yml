name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: write # Required for GitHub Actions to create a Release

jobs:
  build-and-release:
    name: Create Release and Upload Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Removed hardcoded version so it uses packageManager from package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Zip Chrome
        run: |
          pnpm run build:chrome
          cd dist/chrome && zip -r ../../leetcode-plus-chrome.zip .

      - name: Build and Zip Firefox
        run: |
          pnpm run build:firefox
          cd dist/firefox && zip -r ../../leetcode-plus-firefox.zip .

      - name: Build and Zip Edge
        run: |
          pnpm run build:edge
          cd dist/edge && zip -r ../../leetcode-plus-edge.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            leetcode-plus-chrome.zip
            leetcode-plus-firefox.zip
            leetcode-plus-edge.zip
